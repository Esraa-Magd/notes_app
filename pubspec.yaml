name: notes_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dartx: ^1.2.0
  floor: ^1.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  geolocator: ^13.0.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  floor_generator: ^1.5.0
  build_runner: ^2.4.6
  shake: ^2.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/databases/



